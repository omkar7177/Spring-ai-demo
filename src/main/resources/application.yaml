spring:
  application:
    name: demo
  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPEN_AI_KEY}
      chat:
        options:
          model: gpt-6-luna
          max-completion-tokens: 200
          reasoning-effort: low
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: codellama:latest
          temperature: 0.3

server:
  port: 8081